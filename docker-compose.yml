services:
  postgres:
    image: postgres:16-alpine
    container_name: bolt_procure_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: procureos
      POSTGRES_PASSWORD: procureos
      POSTGRES_DB: procureos
    ports:
      - "5432:5432"
    volumes:
      - procureos_pgdata:/var/lib/postgresql/data

volumes:
  procureos_pgdata:
